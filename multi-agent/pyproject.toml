[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmo-agents"
version = "0.1.0"
description = "Multi-agent engineering pipeline for Cosmo Engineering: PM -> Design -> Cost -> QA with a revision loop, on the Claude API."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.13,<2",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
dxf = ["ezdxf>=1.3"]

[project.scripts]
cosmo-agents = "cosmo_agents.cli:main"

[tool.setuptools.packages.find]
include = ["cosmo_agents*"]
